<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="$description">
  <meta name="theme-color" content="#303d38">
  <title>$title</title>
  <link rel="canonical" href="$url">
  <link rel="icon" href="/assets/printer.svg" type="image/svg+xml">
  <link rel="preload" href="/assets/DotMatrix-Bold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/printer.css?v=$css_version">
  <script src="/assets/printer.js?v=$js_version" defer></script>
</head>
<body>
  <svg class="print-effects" width="0" height="0" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Image brightness determines the size of each ink dot. -->
      <filter id="ribbon-print" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feColorMatrix in="SourceGraphic" type="saturate" values="0" result="gray"/>
        <feImage x="0" y="0" width="3" height="3" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2212%22%20height%3D%2212%22%20viewBox%3D%220%200%2012%2012%22%3E%3Cdefs%3E%3CradialGradient%20id%3D%22d%22%20cx%3D%2250%25%22%20cy%3D%2250%25%22%20r%3D%2271%25%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22black%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22white%22%2F%3E%3C%2FradialGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%2212%22%20height%3D%2212%22%20fill%3D%22url%28%23d%29%22%2F%3E%3C%2Fsvg%3E" result="cell"/>
        <feTile in="cell" result="screen"/>
        <feComposite in="gray" in2="screen" operator="arithmetic" k1="0" k2="1" k3="1" k4="-0.5" result="screened"/>
        <feComponentTransfer in="screened" result="dots">
          <feFuncR type="discrete" tableValues="0 1"/>
          <feFuncG type="discrete" tableValues="0 1"/>
          <feFuncB type="discrete" tableValues="0 1"/>
        </feComponentTransfer>
        <feComponentTransfer in="dots" result="ink">
          <feFuncR type="table" tableValues="0.094 0.984"/>
          <feFuncG type="table" tableValues="0.157 0.973"/>
          <feFuncB type="table" tableValues="0.141 0.925"/>
        </feComponentTransfer>
        <feComposite in="ink" in2="SourceGraphic" operator="in" result="print"/>
        <feGaussianBlur in="print" stdDeviation="0.12"/>
      </filter>
      <filter id="ribbon-print-fine" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feColorMatrix in="SourceGraphic" type="saturate" values="0" result="gray"/>
        <feImage x="0" y="0" width="2" height="2" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2212%22%20height%3D%2212%22%20viewBox%3D%220%200%2012%2012%22%3E%3Cdefs%3E%3CradialGradient%20id%3D%22d%22%20cx%3D%2250%25%22%20cy%3D%2250%25%22%20r%3D%2271%25%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22black%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22white%22%2F%3E%3C%2FradialGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%2212%22%20height%3D%2212%22%20fill%3D%22url%28%23d%29%22%2F%3E%3C%2Fsvg%3E" result="cell"/>
        <feTile in="cell" result="screen"/>
        <feComposite in="gray" in2="screen" operator="arithmetic" k1="0" k2="1" k3="1" k4="-0.5" result="screened"/>
        <feComponentTransfer in="screened" result="dots">
          <feFuncR type="discrete" tableValues="0 1"/>
          <feFuncG type="discrete" tableValues="0 1"/>
          <feFuncB type="discrete" tableValues="0 1"/>
        </feComponentTransfer>
        <feComponentTransfer in="dots" result="ink">
          <feFuncR type="table" tableValues="0.153 0.980"/>
          <feFuncG type="table" tableValues="0.173 0.976"/>
          <feFuncB type="table" tableValues="0.161 0.953"/>
        </feComponentTransfer>
        <feComposite in="ink" in2="SourceGraphic" operator="in" result="print"/>
        <feGaussianBlur in="print" stdDeviation="0.12"/>
      </filter>
    </defs>
  </svg>

  <a class="skip-link" href="#projects">Skip to content</a>
  <main id="project-printer" class="site-shell">
    <div class="bench">
      <div class="printer-rear printer-frame" aria-hidden="true"><picture class="case-photo" aria-hidden="true">
          <source media="(max-width: 600px)" srcset="/assets/printer-receipt-compact.webp?v=$receipt_photo_version">
          <img class="case-image" src="/assets/printer-impact-compact.webp?v=$impact_photo_version" width="2172" height="724" alt="" decoding="async" fetchpriority="high">
        </picture></div>
      <div class="paper-window" tabindex="0" role="region" aria-label="Scrollable printout">
        <div class="paper-content">
        <div class="sheet">
          <header class="print-header">
            <h1>$name</h1>
            <div class="intro markdown">$intro_html</div>
            $header_link_html
          </header>
          <section id="projects" aria-label="Printed content">
            <p class="paper-intro">$projects_heading</p>
            $projects_html
          </section>
          <footer class="end-note">
            <p>$end_label</p>
            $footer_links_html
          </footer>
        </div>
        </div>
      </div>
      <div class="printer printer-frame" aria-label="Project paper feed" data-ready="$printer_ready" data-printing="$printer_printing" data-end="$printer_end">
        <picture class="case-photo" aria-hidden="true">
          <source media="(max-width: 600px)" srcset="/assets/printer-receipt-compact.webp?v=$receipt_photo_version">
          <img class="case-image" src="/assets/printer-impact-compact.webp?v=$impact_photo_version" width="2172" height="724" alt="" decoding="async" fetchpriority="high">
        </picture>
        <div class="head-track" aria-hidden="true"><img class="writer-head" src="/assets/printer-impact-head.webp?v=$head_photo_version" alt="" decoding="async"></div>
        <div class="output-slot" aria-hidden="true"></div>
        <div class="front-panel">
          <div class="device-label" aria-hidden="true"><strong><span class="matrix-label">$printer_label</span><span class="receipt-label">$printer_receipt_label</span></strong><div class="status"><i class="status-light"></i><span>$printer_ready</span></div></div>
          <button class="feed" type="button" hidden aria-label="$printer_next_description">$printer_next_label</button>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
